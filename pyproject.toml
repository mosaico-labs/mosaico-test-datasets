[project]
name = "mosaico-test-datasets"
version = "0.1.0"
description = "This package contains scripts to test ROS datasets with Mosaico Platform"
authors = [
    {name = "Pucciland95",email = "niccolo.lucci@mosaico.dev"}
]
requires-python = ">=3.10, <4"
dependencies = [
    "click (>=8.3.2,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "rosbags (>=0.11.2,<0.12.0)",
    "mosaicolabs[cli]",
    "pre-commit (>=4.6.1,<5.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]

[project.scripts]
"mosaicolabs.datasets.ingest_rosbags" = "src.cli:run_dataset_injestor"
"mosaicolabs.datasets.delete_rosbags" = "src.cli:run_dataset_eraser"
"mosaicolabs.datasets.reconstruct_rosbags" = "src.cli:run_unload_datasets"
"mosaicolabs.datasets.check_start_streaming" = "src.cli:run_check_timestream_start"

[tool.uv.sources]
mosaicolabs = { path = "../mosaico/mosaico-sdk-py", editable = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

# Ruff formatter and linter configurations
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["COM812", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true