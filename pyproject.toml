[project]
name = "mosaico-test-datasets"
version = "0.1.0"
description = "This package contains scripts to test ROS datasets with Mosaico Platform"
authors = [
    {name = "Pucciland95",email = "niccolo.lucci@mosaico.dev"}
]
requires-python = ">=3.10, <4"
dependencies = [
    "click (>=8.3.2,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "rosbags (>=0.11.2,<0.12.0)",
    "mosaicolabs",
    "pre-commit (>=4.6.1,<5.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]

[project.scripts]
"mosaicolabs.datasets.injest_rosbags" = "src.cli:run_dataset_injestor"
"mosaicolabs.datasets.delete_rosbags" = "src.cli:run_dataset_eraser"
"mosaicolabs.datasets.recontruct_rosbags" = "src.cli:run_unload_datasets"

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
mosaicolabs = {path = "../mosaico/mosaico-sdk-py", develop = true}


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Ruff formatter and linter configurations
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["COM812", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true