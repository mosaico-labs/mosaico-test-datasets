[project]
name = "mosaico-test-datasets"
version = "0.1.0"
description = "This package contains scripts to test ROS datasets with Mosaico Platform"
authors = [
    {name = "Pucciland95",email = "niccolo.lucci@mosaico.dev"}
]
requires-python = ">=3.10, <4"
dependencies = [
    "click (>=8.3.2,<9.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "rosbags (>=0.11.2,<0.12.0)",
    "mosaicolabs"
]

[project.scripts]
"mosaicolabs.datasets.injest_rosbags" = "src.cli:run_dataset_injestor"
"mosaicolabs.datasets.delete_rosbags" = "src.cli:run_dataset_eraser"
"mosaicolabs.datasets.recontruct_rosbags" = "src.cli:run_unload_datasets"

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
mosaicolabs = {path = "../mosaico/mosaico-sdk-py", develop = true}


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
